<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Volunteer Login | DOINIK TALASH TV</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>DOINIK TALASH TV</h1>
        <p>Volunteer Login</p>
    </header>

    <main>

      <section class="article-page volunteer-login">
            <h2>Volunteer Login</h2>

            <form id="volunteer-login-form">

                <label for="username">
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Enter username"
                    required
                    autocomplete="username"
                >

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter password"
                    required
                    autocomplete="current-password"
                >

                <button type="submit">
                    Login
                </button>

            </form>

            <p id="volunteer-login-message"></p>

        </section>

    </main>

    <footer>
        <p>&copy; 2026 DOINIK TALASH TV. All rights reserved.</p>
    </footer>

    <script src="volunteer-login.js"></script>

</body>

</html>
