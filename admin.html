<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin | DOINIK TALASH TV</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>DOINIK TALASH TV</h1>
        <p>News Management Panel</p>
    </header>

   
        <nav id="main-nav">
    <a href="index.html">Home</a>
    <a href="admin.html">Admin</a>
    <button id="logout-button" type="button">Logout</button>
</nav>
    

    <main>

        <section class="article-page">

            <h2>Add News Article</h2>

            <form id="add-news-form">

                <label for="title">News Title</label>
                <input
                    type="text"
                    id="title"
                    name="title"
                    placeholder="Enter news title"
                    required
                >

                <label for="category">Category</label>
                <select id="category" name="category" required>
                    <option value="">Select category</option>
                    <option value="national">National</option>
                    <option value="politics">Politics</option>
                    <option value="world">World</option>
                    <option value="sports">Sports</option>
                    <option value="business">Business</option>
                    <option value="technology">Technology</option>
                    <option value="entertainment">Entertainment</option>
                </select>

                <label for="description">Description</label>
                <textarea
                    id="description"
                    name="description"
                    rows="4"
                    placeholder="Enter short news description"
                    required
                ></textarea>

                <label for="image">Image URL</label>
                <input
                    type="url"
                    id="image"
                    name="image"
                    placeholder="https://example.com/image.jpg"
                    required
                >

                <label for="content">News Content</label>
                <textarea
                    id="content"
                    name="content"
                    rows="10"
                    placeholder="Write the full news article..."
                    required
                ></textarea>

                <button type="submit">Publish News</button>

            </form>

            <p id="admin-message"></p>
        </section>

        <section class="article-page">
            <h2>Published News</h2>

            <div class="news-grid" id="admin-news-grid">
                <p>Loading published news...</p>
            </div>
        </section>

    </main>

    <footer>
        <p>&copy; 2026 DOINIK TALASH TV. All rights reserved.</p>
    </footer>
<script>
    function escapeHtml(value) {
    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}
    const form = document.getElementById("add-news-form");
    const message = document.getElementById("admin-message");
const editId = new URLSearchParams(window.location.search).get("edit");
const submitButton = form.querySelector("button[type='submit']");
    form.addEventListener("submit", async function (event) {
        event.preventDefault();

        message.textContent = "Publishing news...";

        const newsData = {
            title: document.getElementById("title").value.trim(),
            category: document.getElementById("category").value,
            description: document.getElementById("description").value.trim(),
            image: document.getElementById("image").value.trim(),
            content: document.getElementById("content").value.trim()
        };

        try {
            const url = editId
    ? `/api/news/${encodeURIComponent(editId)}`
    : "/api/news";

const method = editId ? "PUT" : "POST";

const response = await fetch(url, {
    method: method,
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(newsData)
            });

            const result = await response.json();

            if (!response.ok) {
                throw new Error(result.message || "Failed to publish news");
            }

          if (editId) {
    message.textContent =
        `News updated successfully! Article ID: ${result.id}`;

    window.location.href = "admin.html";
} else {
    message.textContent =
        `News published successfully! Article ID: ${result.id}`;

    form.reset();
}

        } catch (error) {
            console.error("Publish error:", error);

            message.textContent =
                `Unable to publish news: ${error.message}`;
        }
    });
    async function loadAdminNews() {
    const grid = document.getElementById("admin-news-grid");

    if (!grid) return;

    try {
        const response = await fetch("/api/news");

        if (!response.ok) {
            throw new Error(`News API returned ${response.status}`);
        }

        const news = await response.json();

        grid.innerHTML = "";

        if (!Array.isArray(news) || news.length === 0) {
            grid.innerHTML = "<p>No published news available.</p>";
            return;
        }

       news.forEach(item => {
    const card = document.createElement("article");
    card.className = "news-card";

    const image = escapeHtml(item.image || "");
    const title = escapeHtml(item.title || "Untitled news");
    const description = escapeHtml(item.description || "");
    const category = escapeHtml(
        String(item.category || "NEWS").toUpperCase()
    );
    const id = Number(item.id);

    card.innerHTML = `
        <div class="card-image">
            <img
                src="${image}"
                alt="${title}"
                loading="lazy"
            >
        </div>

        <span class="category">
            ${category}
        </span>

        <h3>${title}</h3>

        <p>${description}</p>

        <a
            href="article.html?id=${id}"
            class="read-more"
        >
            View Article
        </a>

        <a
            href="admin.html?edit=${id}"
            class="read-more"
        >
            Edit
        </a>

        <button
            type="button"
            class="delete-news-button"
            data-id="${id}"
        >
            Delete
        </button>
    `;

    grid.appendChild(card);
});
} catch (error) {
        console.error("Admin news error:", error);
        grid.innerHTML =
            "<p>Unable to load published news right now.</p>";
    }
}

loadAdminNews();
async function loadEditArticle() {
    if (!editId) return;

    try {
        const response = await fetch(`/api/news/${encodeURIComponent(editId)}`);

        if (!response.ok) {
            throw new Error(`Article API returned ${response.status}`);
        }

        const article = await response.json();

        document.getElementById("title").value = article.title || "";
        document.getElementById("category").value = article.category || "";
        document.getElementById("description").value = article.description || "";
        document.getElementById("image").value = article.image || "";
        document.getElementById("content").value = article.content || "";

        submitButton.textContent = "Update News";
        message.textContent = `Editing Article ID: ${article.id}`;

    } catch (error) {
        console.error("Load edit article error:", error);
        message.textContent = "Unable to load article for editing.";
    }
}

loadEditArticle();
document.addEventListener("click", async function (event) {

    if (!event.target.classList.contains("delete-news-button")) {
        return;
    }

    const id = event.target.dataset.id;

    const confirmed = confirm(
        "Are you sure you want to delete this news article?"
    );

    if (!confirmed) {
        return;
    }

    try {
        const response = await fetch(`/api/news/${id}`, {
            method: "DELETE"
        });

        const result = await response.json();

        if (!response.ok) {
            throw new Error(result.message || "Failed to delete news");
        }

        alert("News deleted successfully!");

        loadAdminNews();
       

    } catch (error) {
        console.error("Delete error:", error);
        alert(`Unable to delete news: ${error.message}`);
    }
});
const logoutButton = document.getElementById("logout-button");

if (logoutButton) {
    logoutButton.addEventListener("click", async function () {
        try {
            const response = await fetch("/api/admin/logout", {
                method: "POST"
            });

            const result = await response.json();

            if (!response.ok) {
                throw new Error(result.message || "Logout failed");
            }

            window.location.href = "/admin-login.html";

        } catch (error) {
            console.error("Logout error:", error);
            alert("Unable to logout. Please try again.");
        }
    });
}
</script>
</body>

</html>
