<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin | DOINIK TALASH TV</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>DOINIK TALASH TV</h1>
        <p>News Management Panel</p>
    </header>

   
        <nav id="main-nav">
   <a href="index.html">Home</a>
<a href="admin.html">Admin</a>
<a href="dashboard.html">Dashboard</a>
<button id="logout-button" type="button">Logout</button>
</nav>
    

    <main>


            <h2>Add News Article</h2>

            <form id="add-news-form">

                <label for="title">News Title</label>
                <input
                    type="text"
                    id="title"
                    name="title"
                    placeholder="Enter news title"
                    required
                >

                <label for="category">Category</label>
                <select id="category" name="category" required>
                    <option value="">Select category</option>
                    <option value="national">National</option>
                    <option value="politics">Politics</option>
                    <option value="world">World</option>
                    <option value="sports">Sports</option>
                    <option value="business">Business</option>
                    <option value="technology">Technology</option>
                    <option value="entertainment">Entertainment</option>
                </select>

                <label for="description">Description</label>
                <textarea
                    id="description"
                    name="description"
                    rows="4"
                    placeholder="Enter short news description"
                    required
                ></textarea>

               <label for="image">News Image</label>

<input
    type="file"
    id="image-file"
    name="image"
    accept="image/*"
>

<input
    type="hidden"
    id="image"
    name="image"
>

<p id="image-name">No image selected</p>

                <label for="content">News Content</label>
                <textarea
                    id="content"
                    name="content"
                    rows="10"
                    placeholder="Write the full news article..."
                    required
                ></textarea>

                <button type="submit">Publish News</button>

            </form>

            <p id="admin-message"></p>
        </section>

       <section class="article-page" id="published-news">
    <h2>Published News</h2>

            <div class="news-grid" id="admin-news-grid">
                <p>Loading published news...</p>
            </div>
        </section>

    </main>

    <footer>
        <p>&copy; 2026 DOINIK TALASH TV. All rights reserved.</p>
    </footer>
<script src="admin.js"></script>
</body>

</html>
